[package]
name = "katsvg-engine"
version = "0.1.0"
edition = "2024"
description = "Lightweight, High-Speed, Zero-Hallucination SVG Infographic Generator"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
ab_glyph = "0.2"

# katgpt-core is only used for the ConstraintPruner trait. For the wasm32 target
# it drags in getrandom (not supported), so a local trait stub (identical
# signature) is used instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
katgpt-core = { path = "../katgpt-rs/crates/katgpt-core" }
fastrand = "2"

[[bin]]
name = "katsvg"
path = "src/bin/katsvg.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

# WASM entry point: `cargo build --target wasm32-unknown-unknown --bin katsvg-wasm`
[[bin]]
name = "katsvg-wasm"
path = "src/bin/katsvg_wasm.rs"
