<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap');
    text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .title { font-size: 28px; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-size: 14px; font-weight: 400; fill: #9CA3AF; }
    .card-title { font-size: 16px; font-weight: 600; fill: #F8FAFC; }
