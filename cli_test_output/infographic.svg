    .metric-val { font-size: 24px; font-weight: 800; fill: #6366F1; }
    .metric-lbl { font-size: 11px; font-weight: 600; fill: #9CA3AF; letter-spacing: 0.5px; }
    .badge { font-size: 12px; font-weight: 800; fill: #0F172A; }
  </style>
  <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
